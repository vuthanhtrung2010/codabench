services:
  #----------------------------------------------------------------------------------------------------
  #   Django Web Backend
  #----------------------------------------------------------------------------------------------------
  django:
    container_name: django
    build: 
      context: .
      dockerfile: packaging/container/Containerfile
    image: django_site-worker
    command: ["python manage.py migrate --no-input && python manage.py collectstatic --no-input --clear && cd /app/src && watchmedo auto-restart -p '*.py' --recursive -- python3 ./gunicorn_run.py"]
    environment:
      - DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
    env_file: .env
    volumes:
      - .:/app:delegated
      - /tmp/codalab-v2/django:/codalab_tmp
      - ./backups:/app/backups
      - ./var/logs:/app/logs
    restart: unless-stopped
    ports:
      - "8080:8000"
    depends_on:
      rabbit:
        condition: service_started
      builder:
        condition: service_healthy
    extra_hosts:
      - "redis:host-gateway"
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  #----------------------------------------------------------------------------------------------------
  #   Local development helper (Builder)
  #----------------------------------------------------------------------------------------------------
  builder:
    container_name: builder
    build:
      context: .
      dockerfile: packaging/container/Containerfile.builder
    volumes:
      - .:/app:delegated
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/.builder_ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 2s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  #----------------------------------------------------------------------------------------------------
  #   RabbitMQ Message Broker
  #----------------------------------------------------------------------------------------------------
  rabbit:
    container_name: rabbit
    build:
      context: .
      dockerfile: packaging/container/Containerfile.rabbitmq
      args:
        - WORKER_CONNECTION_TIMEOUT=${WORKER_CONNECTION_TIMEOUT}
    hostname: rabbit
    env_file: .env
    environment:
      - http_proxy=${RABBITMQ_HTTP_PROXY}
      - https_proxy=${RABBITMQ_HTTPS_PROXY}
      - no_proxy=${RABBITMQ_NO_PROXY}
    ports:
      - ${RABBITMQ_MANAGEMENT_PORT:-15672}:15672
      - ${RABBITMQ_PORT}:5672
    volumes:
      - ./var/rabbit:/var/lib/rabbitmq
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  #----------------------------------------------------------------------------------------------------
  #   Flower (Celery Monitoring)
  #----------------------------------------------------------------------------------------------------
  flower:
    container_name: flower
    image: mher/flower
    env_file: .env
    environment:
      - CELERY_BROKER_URL=pyamqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//
    restart: unless-stopped
    ports:
      - ${FLOWER_PUBLIC_PORT:-5555}:5555
    depends_on:
      - rabbit
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  #----------------------------------------------------------------------------------------------------
  #   Celery Service (Site Worker)
  #----------------------------------------------------------------------------------------------------
  site_worker:
    command: ["celery -A celery_config worker -B -Q site-worker -l info -n site-worker@%n --concurrency=2"]
    working_dir: /app/src
    container_name: site_worker
    build:
      context: .
      dockerfile: packaging/container/Containerfile
    image: django_site-worker
    depends_on:
      - rabbit
    extra_hosts:
      - "redis:host-gateway"
      - "host.docker.internal:host-gateway"
    env_file: .env
    volumes:
      - .:/app
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 15GB

  #----------------------------------------------------------------------------------------------------
  #   Compute Worker
  #----------------------------------------------------------------------------------------------------
  compute_worker:
    command: ["celery -A compute_worker worker -l info -Q compute-worker -n compute-worker@%n"]
    working_dir: /app
    container_name: compute_worker
    build:
      context: .
      dockerfile: packaging/container/Containerfile.compute_worker
    depends_on:
      - django
      - rabbit
    volumes:
      - ./compute_worker:/app
      - ${HOST_DIRECTORY:-/tmp/codabench}:/codabench
      - /var/run/docker.sock:/var/run/docker.sock
    hostname: local_worker
    restart: unless-stopped
    env_file: .env
    environment:
      - BROKER_URL=pyamqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@${RABBITMQ_HOST}:${RABBITMQ_PORT}//
      - CODALAB_IGNORE_CLEANUP_STEP=1
    tty: true
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
